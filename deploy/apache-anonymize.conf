# /etc/apache2/sites-available/anonymize-cpathportal.conf
#
# anonymizer.example.org is proxied by Cloudflare; the origin uses the
# Cloudflare Origin certificate for the domain.
<VirtualHost *:443>
    ServerName anonymizer.example.org
    SSLEngine on
    SSLCertificateFile /etc/ssl/cert.pem
    SSLCertificateKeyFile /etc/ssl/key.pem

    ProxyPreserveHost On
    ProxyPass / http://127.0.0.1:8790/
    ProxyPassReverse / http://127.0.0.1:8790/
    RequestHeader set X-Forwarded-Proto "https"
    Header always set Strict-Transport-Security "max-age=31536000"
    # Login form only; slides never reach the server.
    LimitRequestBody 65536

    LogLevel warn
    ErrorLog ${APACHE_LOG_DIR}/anonymize-error.log
    CustomLog ${APACHE_LOG_DIR}/anonymize-access.log combined
</VirtualHost>

<VirtualHost *:80>
    ServerName anonymizer.example.org
    Redirect permanent / https://anonymizer.example.org/
</VirtualHost>
